version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: pmo-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: pmo_erp
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmo_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pmo_pgdata:
